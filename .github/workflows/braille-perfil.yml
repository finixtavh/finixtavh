name: Braille del perfil

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      width:
        description: "Ancho en px (vacío = el valor de BRAILLE_WIDTH)"
        required: false
        type: string
      height:
        description: "Alto en px (vacío = el valor de BRAILLE_HEIGHT)"
        required: false
        type: string


env:
  BRAILLE_WIDTH: "1920"       
  BRAILLE_HEIGHT: "64"     
  BRAILLE_FONT_SIZE: "17"    
  BRAILLE_BG: "13131e"       


permissions:
  contents: write            # necesario para que el workflow pueda hacer push

concurrency:
  group: braille-perfil
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del perfil
        uses: actions/checkout@v4

      - name: Checkout del generador
        uses: actions/checkout@v4
        with:
          repository: finixtavh/braille
          path: generador

      - name: Instalar dependencias
        run: python3 -m pip install numpy pillow

      - name: Generar imagen nueva
        id: gen
        env:
          INPUT_WIDTH: ${{ inputs.width }}      # vacío cuando corre por el cron
          INPUT_HEIGHT: ${{ inputs.height }}
        run: |
          set -o pipefail
          W="${INPUT_WIDTH:-$BRAILLE_WIDTH}"
          H="${INPUT_HEIGHT:-$BRAILLE_HEIGHT}"
          [[ "$W" =~ ^[0-9]+$ && "$H" =~ ^[0-9]+$ ]] || { echo "Ancho/alto inválidos: '$W' x '$H'"; exit 1; }
          [[ "$BRAILLE_BG" =~ ^[0-9a-fA-F]{6}$ ]] || { echo "BRAILLE_BG debe ser hex de 6 dígitos"; exit 1; }
          grep -q 'braille\.png' README.md || { echo "README.md no referencia img/braille.png"; exit 1; }

          python3 generador/braille_gen.py --font-size "$BRAILLE_FONT_SIZE" \
            --width "$W" --height "$H" --ink white --bg "$BRAILLE_BG" \
            --out-dir /tmp/braille | tee /tmp/gen.log
          SEED=$(grep -oP 'seed: \K[0-9a-f]{8}' /tmp/gen.log | head -1)

          mkdir -p img
          mv /tmp/braille/braille-*-white.png img/braille.png
          # ?v=seed cambia la URL en cada ejecución: GitHub y los navegadores
          # no reutilizan la imagen anterior.
          sed -i -E "s#braille\.png(\?v=[0-9a-f]+)?#braille.png?v=${SEED}#g" README.md
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: Commit y push
        run: |
          git config user.name "finixtavh"
          git config user.email "id	68766717+finixtavh@users.noreply.github.com"
          git add img/braille.png README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: nuevo braille del perfil (seed ${{ steps.gen.outputs.seed }})"
          git push
