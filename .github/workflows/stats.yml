name: Update GitHub Development Stats.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate statistics SVG
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: finixtavh
        run: python3 scripts/update_stats.py

      - name: Commit updated SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add profile/github-stats.svg

          if git diff --cached --quiet; then
            echo 'No statistics changes.'
            exit 0
          fi

          git commit -m 'chore: update GitHub development stats'
          git push
